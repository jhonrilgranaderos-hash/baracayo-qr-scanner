
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baracayo QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 25px auto;
      padding: 16px;
      background: #f5f6fa;
      color: #202334;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px #0001;
    }
    h2 { color: #7b1e2b; }
    button {
      background: #7b1e2b;
      color: white;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      margin: 6px 4px 6px 0;
    }
    button:disabled { opacity: .5; }
    #reader { width: 100%; margin-top: 16px; }
    #status { white-space: pre-wrap; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Baracayo Integrated School</h2>
    <p>Centralized Student Entry & Exit Attendance</p>
    <p id="connection">Checking connection to the attendance app…</p>
    <div id="reader"></div>
    <button id="startBtn" onclick="startScanner()">Start Camera</button>
    <button onclick="stopScanner()">Stop Camera</button>
    <div id="status">Open this page from the signed-in attendance app.</div>
  </div>

  <script>
    let scanner = null;
    let busy = false;

    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    function status(message) {
      statusEl.textContent = message;
    }

    function startScanner() {
      if (!window.opener || window.opener.closed) {
        status('No attendance app was detected. Sign in to the Apps Script app and open this scanner from there.');
        return;
      }

      if (typeof Html5Qrcode === 'undefined') {
        status('Scanner library failed to load. Check your internet connection.');
        return;
      }

      if (scanner) return;

      scanner = new Html5Qrcode('reader');
      startBtn.disabled = true;

      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 230, height: 230 } },
        decodedText => {
          if (busy) return;

          const studentId = String(decodedText || '').trim();
          if (!studentId || studentId.length > 100) {
            status('Invalid Student ID in QR code.');
            return;
          }

          busy = true;
          stopScanner();

          // Send only the Student ID. Never send login passwords or tokens.
          window.opener.postMessage(
            { type: 'BARACAYO_STUDENT_SCAN', studentId: studentId },
            '*'
          );

          status('Student ID sent to the attendance app. Check the original tab for the recording result.');
          setTimeout(() => {
            busy = false;
            startBtn.disabled = false;
          }, 1800);
        }
      ).then(() => {
        status('Camera ready. Point it at the student QR code.');
      }).catch(error => {
        scanner = null;
        startBtn.disabled = false;
        status('Camera could not start: ' + error +
          '\nAllow camera access in your browser settings and try again.');
      });
    }

    function stopScanner() {
      if (!scanner) return;

      const activeScanner = scanner;
      scanner = null;
      startBtn.disabled = false;

      activeScanner.stop()
        .then(() => activeScanner.clear())
        .catch(() => {});
    }

    window.addEventListener('beforeunload', stopScanner);

    if (window.opener && !window.opener.closed) {
      document.getElementById('connection').textContent =
        'Opened from another tab. Ready to connect when you start scanning.';
    } else {
      document.getElementById('connection').textContent =
        'Not connected to the attendance app yet.';
    }
  </script>
</body>
</html>
